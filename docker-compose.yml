services:

  # ── Database ────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: lsg-postgres
    environment:
      POSTGRES_USER: litsurvey
      POSTGRES_PASSWORD: litsurvey_dev_password
      POSTGRES_DB: literature_survey
    ports:
      - "5436:5432"
    volumes:
      - lsg_postgres_data:/var/lib/postgresql/data
      - ./packages/backend/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litsurvey"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── n8n (local) ──────────────────────────────────────────────────────────────
  n8n:
    image: n8nio/n8n:latest
    container_name: lsg-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      WEBHOOK_URL: http://localhost:5678/
      N8N_HOST: 0.0.0.0
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      # Disable owner/email setup on first launch for a smooth experience.
      N8N_SKIP_OWNER_SETUP: "true"
      # Timezone (change to yours if needed).
      GENERIC_TIMEZONE: Asia/Colombo
      # Store n8n data (workflows, credentials) in the mounted volume.
      N8N_USER_FOLDER: /home/node/.n8n
    volumes:
      - lsg_n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy

  # ── Backend API ──────────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: packages/backend/Dockerfile
    container_name: lsg-backend
    environment:
      PORT: 3000
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: literature_survey
      DB_USER: litsurvey
      DB_PASSWORD: litsurvey_dev_password
      # n8n is on the same Docker network — use the service name directly.
      N8N_URL: http://n8n:5678
      N8N_WEBHOOK_URL: http://n8n:5678/webhook/survey-workflow
      # Sync mode works fine with local n8n — no Cloudflare in the way.
      N8N_COMPLETION_MODE: sync
      N8N_CALLBACK_SECRET: ""
    ports:
      - "3001:3000"
    depends_on:
      postgres:
        condition: service_healthy
      n8n:
        condition: service_started

  frontend:
    build:
      context: .
      dockerfile: packages/frontend/Dockerfile
    container_name: lsg-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  lsg_postgres_data:
  lsg_n8n_data:
